<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>숲속의 모찌</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #6f7a54;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        overscroll-behavior: none;
      }
      /*
        iOS 사파리는 주소창이 접히고 펴지면서 100% 가 흔들린다.
        dvh 를 아는 브라우저는 이 줄로 덮어쓰고, 모르면 위의 100% 를 쓴다.
      */
      body { height: 100dvh; }
      /* 노치/홈 인디케이터 여백을 재기 위한 탐침. 보이지 않는다. */
      #safe-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        visibility: hidden;
        pointer-events: none;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="safe-probe"></div>
    <canvas id="stage"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
